<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycle Bin - MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 md:p-8 font-sans transition-colors duration-250">

    <nav class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md px-6 py-4 mb-8 rounded-2xl max-w-4xl mx-auto flex justify-between items-center transition-colors duration-250">
        <div class="flex items-center gap-3">
            <a href="index.html" class="bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 p-2.5 rounded-xl shadow-sm hover:bg-indigo-200 transition-colors flex items-center justify-center" title="Back to Dashboard">
                &larr;
            </a>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold text-gray-800 dark:text-gray-100 tracking-tight transition-colors">Recycle Bin</h1>
                <p class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider">EMPLOYEE ADMINISTRATION</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex flex-col text-right">
                <span id="userName" class="text-xs md:text-sm font-bold text-gray-800 dark:text-gray-200 transition-colors">Loading...</span>
                <span id="userRole" class="text-[9px] self-end px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-indigo-50 text-indigo-600 border border-indigo-100 dark:bg-indigo-950/40 dark:text-indigo-400 dark:border-indigo-900 mt-0.5 transition-colors">...</span>
            </div>
            
            <div class="h-8 w-px bg-gray-200 dark:bg-gray-700"></div>

            <button id="btnTheme" onclick="toggleTheme()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 p-2.5 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:shadow-sm active:scale-95 flex items-center justify-center" title="Toggle Theme">
                <span id="themeIcon">🌙</span>
            </button>
            
            <button onclick="logout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 dark:bg-red-950/20 dark:hover:bg-red-950/40 text-red-600 dark:text-red-400 font-bold text-xs md:text-sm py-2 px-3.5 md:px-4 rounded-xl border border-red-100 dark:border-red-900/50 transition-all hover:shadow-sm active:scale-95" title="Logout">
                <span class="hidden sm:inline">Logout</span>
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Deleted Employees</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">You can restore or permanently delete them from the database.</p>
                </div>
                <div>
                    <button type="button" onclick="loadTrash()" class="text-sm bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/45 dark:hover:bg-blue-900/45 text-blue-600 dark:text-blue-450 font-bold py-1.5 px-3 rounded-lg border border-blue-100 dark:border-blue-900/50 transition-colors">
                        ↻ Refresh
                    </button>
                </div>
            </div>

            <div id="trashList" class="space-y-4 max-h-[500px] overflow-y-auto pr-2 scrollbar-thin">
                <p class="text-gray-500 dark:text-gray-400 text-sm italic transition-colors">Loading...</p>
            </div>
        </div>
    </div>

    <script src="js/trash.js"></script>
</body>

</html>
