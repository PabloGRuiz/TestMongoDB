<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Employee Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center font-sans transition-colors duration-250 p-4">

    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 w-full max-w-md my-8 transition-colors duration-250">
        <div class="mb-6 border-b dark:border-gray-700 pb-4 text-center">
            <h2 class="text-3xl font-extrabold text-gray-800 dark:text-gray-100 transition-colors">Create Account</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Register a new administrator user</p>
        </div>

        <form id="formRegister" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-750 dark:text-gray-300 mb-1 transition-colors">User ID</label>
                <input type="text" id="userId" placeholder="e.g. USR-001" required
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-750 dark:text-gray-300 mb-1 transition-colors">Full Name</label>
                <input type="text" id="name" placeholder="e.g. Jane Doe" required
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-750 dark:text-gray-300 mb-1 transition-colors">Email</label>
                <input type="email" id="email" placeholder="user@company.com" required
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-750 dark:text-gray-300 mb-1 transition-colors">Role</label>
                <select id="role" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-all">
                    <option value="Admin">Administrator</option>
                    <option value="HR">Human Resources</option>
                    <option value="Viewer">Read Only</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-750 dark:text-gray-300 mb-1 transition-colors">Password</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6"
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-all">
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all active:scale-95">
                Register
            </button>
        </form>

        <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>

        <div class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400 transition-colors">
            Already have an account? <a href="login.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline transition-colors">Sign in here</a>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
