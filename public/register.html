<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Dashboard Legajos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 w-full max-w-md my-8">
        <div class="mb-6 border-b pb-4 text-center">
            <h2 class="text-3xl font-bold text-gray-800">Crear Cuenta</h2>
            <p class="text-gray-500 text-sm mt-1">Registro de nuevo usuario administrador</p>
        </div>

        <form id="formRegister" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ID de Usuario</label>
                <input type="text" id="user_id" placeholder="Ej: USR-001" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
                <input type="text" id="user_name" placeholder="Ej: Juan Pérez" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" id="user_mail" placeholder="usuario@empresa.com" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Rol</label>
                <select id="user_rol" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Admin">Administrador</option>
                    <option value="RRHH">Recursos Humanos</option>
                    <option value="Viewer">Solo Lectura</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="user_password" placeholder="••••••••" required minlength="6"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">
                Registrarse
            </button>
        </form>

        <div id="mensaje" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>

        <div class="mt-6 text-center text-sm text-gray-600">
            ¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 font-bold hover:underline">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            const mensajeDiv = document.getElementById('mensaje');
            btnSubmit.innerText = "Creando cuenta...";
            mensajeDiv.classList.add('hidden');

            const datos = {
                user_id: document.getElementById('user_id').value,
                user_name: document.getElementById('user_name').value,
                user_mail: document.getElementById('user_mail').value,
                user_rol: document.getElementById('user_rol').value,
                user_password: document.getElementById('user_password').value
            };

            try {
                const respuesta = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    mensajeDiv.className = "mt-4 p-3 rounded-lg text-sm text-center font-medium bg-green-100 text-green-700 block";
                    mensajeDiv.innerText = "¡Registro exitoso! Redirigiendo...";
                    mensajeDiv.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    console.error("Error devuelto por el servidor:", data);
                    throw new Error(data.detalle || data.error);
                }
            } catch (error) {
                console.error("Error en el cliente durante el registro:", error);
                mensajeDiv.className = "mt-4 p-3 rounded-lg text-sm text-center font-medium bg-red-100 text-red-700 block";
                mensajeDiv.innerText = `Error: ${error.message}` || "Error al registrarse";
                mensajeDiv.classList.remove('hidden');
            } finally {
                if(btnSubmit.innerText !== "Creando cuenta...") {
                    btnSubmit.innerText = "Registrarse";
                }
            }
        });
    </script>
</body>
</html>
