<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 md:p-8 font-sans transition-colors duration-250">

    <nav class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md px-6 py-4 mb-8 rounded-2xl max-w-6xl mx-auto flex justify-between items-center transition-colors duration-250">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100 dark:shadow-none flex items-center justify-center">
                <span class="text-xl font-bold font-mono tracking-wider">E</span>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold text-gray-800 dark:text-gray-100 tracking-tight transition-colors">Employee Dashboard</h1>
                <p class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider">MONGODB SYSTEM</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex flex-col text-right">
                <span id="userName" class="text-xs md:text-sm font-bold text-gray-800 dark:text-gray-200 transition-colors">Loading...</span>
                <span id="userRole" class="text-[9px] self-end px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-indigo-50 text-indigo-600 border border-indigo-100 dark:bg-indigo-950/40 dark:text-indigo-400 dark:border-indigo-900 mt-0.5 transition-colors">...</span>
            </div>
            
            <div class="h-8 w-px bg-gray-200 dark:bg-gray-700"></div>

            <button id="btnTheme" onclick="toggleTheme()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-750 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-2.5 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:shadow-sm active:scale-95 flex items-center justify-center" title="Toggle Theme">
                <span id="themeIcon">🌙</span>
            </button>
            
            <a href="trash.html" id="btnTrash" class="hidden flex items-center gap-2 bg-yellow-50 hover:bg-yellow-100 dark:bg-yellow-950/30 dark:hover:bg-yellow-900/50 text-yellow-700 dark:text-yellow-400 font-bold text-xs md:text-sm py-2 px-3.5 md:px-4 rounded-xl border border-yellow-200 dark:border-yellow-700/50 transition-all hover:shadow-sm active:scale-95" title="Trash">
                <span class="hidden sm:inline">Trash</span>
                <span>🗑️</span>
            </a>
            
            <button onclick="logout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 dark:bg-red-950/20 dark:hover:bg-red-950/40 text-red-600 dark:text-red-400 font-bold text-xs md:text-sm py-2 px-3.5 md:px-4 rounded-xl border border-red-100 dark:border-red-900/50 transition-all hover:shadow-sm active:scale-95" title="Logout">
                <span class="hidden sm:inline">Logout</span>
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 self-start transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Add Employee</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Enter base and dynamic data</p>
            </div>

            <form id="formEmployee" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Employee ID</label>
                    <input type="text" id="employeeId" placeholder="e.g. EMP-003" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Jane Doe" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Position</label>
                    <input type="text" id="position" placeholder="e.g. Backend Developer" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Email (Optional)</label>
                        <input type="email" id="email" placeholder="e.g. jane@company.com"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Phone (Optional)</label>
                        <input type="text" id="phone" placeholder="e.g. +1 555 1234"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                    </div>
                </div>

                <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-700/40 rounded-lg border border-gray-200 dark:border-gray-650 transition-colors">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-sm font-bold text-indigo-750 dark:text-indigo-400 transition-colors">Additional Info (Dynamic)</label>
                        <button type="button" id="btnAddField"
                            class="text-xs bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-950/80 dark:hover:bg-indigo-900 dark:text-indigo-300 text-indigo-700 font-bold py-1.5 px-3.5 rounded-lg transition-colors">
                            + Add Field
                        </button>
                    </div>

                    <div id="dynamicFieldsContainer" class="space-y-2"></div>
                </div>

                <button type="submit"
                    class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">
                    Save to MongoDB
                </button>
            </form>

            <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 self-start transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4 flex justify-between items-center transition-colors">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Database</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Real-time viewer</p>
                </div>
                <div>
                    <button type="button" onclick="loadEmployees()" class="text-sm bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/45 dark:hover:bg-blue-900/45 text-blue-600 dark:text-blue-450 font-bold py-1.5 px-3 rounded-lg border border-blue-100 dark:border-blue-900/50 transition-colors">
                        ↻ Refresh
                    </button>
                </div>
            </div>

            <div class="mb-4 flex gap-2">
                <button type="button" onclick="exportBackup()" class="flex-1 text-sm bg-green-100 hover:bg-green-200 dark:bg-green-950/40 dark:hover:bg-green-900/40 text-green-700 dark:text-green-400 font-bold py-2 px-3 rounded text-center transition-colors border border-green-200/30">
                    ⬇️ Export Backup
                </button>
                <label class="flex-1 text-sm bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-950/40 dark:hover:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 font-bold py-2 px-3 rounded cursor-pointer text-center transition-colors border border-indigo-200/30">
                    ⬆️ Import Backup
                    <input type="file" id="inputImport" accept=".json" class="hidden" onchange="importBackup(event)">
                </label>
            </div>

            <div class="mb-4">
                <input type="text" id="inputSearch" placeholder="Search by name, position or ID..." class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors shadow-sm" onkeyup="filterEmployees(event)">
            </div>

            <div id="employeesList" class="space-y-4 max-h-[420px] overflow-y-auto pr-2 scrollbar-thin">
                <p class="text-gray-500 dark:text-gray-400 text-sm italic transition-colors">Loading employees...</p>
            </div>

            <div id="employeesPagination" class="mt-6 flex justify-between items-center text-sm px-1">
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>

</html>
