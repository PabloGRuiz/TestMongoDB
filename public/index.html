<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Legajos - MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8 font-sans">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 self-start">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-gray-800">Cargar Legajo</h2>
                <p class="text-gray-500 text-sm mt-1">Carga de datos base y dinámicos</p>
            </div>

            <form id="formLegajo" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ID de Legajo</label>
                    <input type="text" id="legajo_id" placeholder="Ej: LEG-003" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana Clara Ruiz" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Puesto</label>
                    <input type="text" id="puesto" placeholder="Ej: Backend Developer" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-sm font-bold text-indigo-700">Información Adicional (Dinámica)</label>
                        <button type="button" id="btnAgregarCampo"
                            class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-1 px-3 rounded">
                            + Agregar Dato
                        </button>
                    </div>

                    <div id="contenedorCamposDinamicos" class="space-y-2"></div>
                </div>

                <button type="submit"
                    class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">
                    Guardar en MongoDB
                </button>
            </form>

            <div id="mensaje" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 self-start">
            <div class="mb-6 border-b pb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Base de Datos</h2>
                    <p class="text-gray-500 text-sm mt-1">Visor en tiempo real</p>
                </div>
                <div class="flex gap-4 items-center">
                    <button type="button" onclick="cargarLegajos()" class="text-sm text-blue-600 hover:underline">↻ Actualizar</button>
                    <button type="button" onclick="logout()" class="text-sm text-red-600 hover:underline">Cerrar Sesión</button>
                </div>
            </div>

            <div id="listaLegajos" class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
                <p class="text-gray-500 text-sm italic">Cargando legajos...</p>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>

</html>
