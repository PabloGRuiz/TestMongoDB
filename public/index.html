<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Legajos - MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        // Aplicar tema guardado inmediatamente
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 md:p-8 font-sans transition-colors duration-250">

    <!-- NAVBAR -->
    <nav class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md px-6 py-4 mb-8 rounded-2xl max-w-6xl mx-auto flex justify-between items-center transition-colors duration-250">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100 dark:shadow-none flex items-center justify-center">
                <span class="text-xl font-bold font-mono tracking-wider">L</span>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold text-gray-800 dark:text-gray-100 tracking-tight transition-colors">Dashboard Legajos</h1>
                <p class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider">SISTEMA MONGODB</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex flex-col text-right">
                <span id="userName" class="text-xs md:text-sm font-bold text-gray-800 dark:text-gray-200 transition-colors">Cargando...</span>
                <span id="userRole" class="text-[9px] self-end px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-indigo-50 text-indigo-600 border border-indigo-100 dark:bg-indigo-950/40 dark:text-indigo-400 dark:border-indigo-900 mt-0.5 transition-colors">...</span>
            </div>
            
            <div class="h-8 w-px bg-gray-200 dark:bg-gray-700"></div>

            <!-- BOTÓN MODO OSCURO -->
            <button id="btnTheme" onclick="toggleTheme()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-750 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-2.5 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:shadow-sm active:scale-95 flex items-center justify-center" title="Cambiar Tema">
                <span id="themeIcon">🌙</span>
            </button>
            
            <button onclick="logout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 dark:bg-red-950/20 dark:hover:bg-red-950/40 text-red-600 dark:text-red-400 font-bold text-xs md:text-sm py-2 px-3.5 md:px-4 rounded-xl border border-red-100 dark:border-red-900/50 transition-all hover:shadow-sm active:scale-95" title="Cerrar Sesión">
                <span class="hidden sm:inline">Cerrar Sesión</span>
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 self-start transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Cargar Legajo</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Carga de datos base y dinámicos</p>
            </div>

            <form id="formLegajo" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">ID de Legajo</label>
                    <input type="text" id="legajo_id" placeholder="Ej: LEG-003" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana Clara Ruiz" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1 transition-colors">Puesto</label>
                    <input type="text" id="puesto" placeholder="Ej: Backend Developer" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 outline-none transition-colors">
                </div>

                <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-700/40 rounded-lg border border-gray-200 dark:border-gray-650 transition-colors">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-sm font-bold text-indigo-750 dark:text-indigo-400 transition-colors">Información Adicional (Dinámica)</label>
                        <button type="button" id="btnAgregarCampo"
                            class="text-xs bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-950/80 dark:hover:bg-indigo-900 dark:text-indigo-300 text-indigo-700 font-bold py-1.5 px-3.5 rounded-lg transition-colors">
                            + Agregar Dato
                        </button>
                    </div>

                    <div id="contenedorCamposDinamicos" class="space-y-2"></div>
                </div>

                <button type="submit"
                    class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">
                    Guardar en MongoDB
                </button>
            </form>

            <div id="mensaje" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 self-start transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4 flex justify-between items-center transition-colors">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Base de Datos</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Visor en tiempo real</p>
                </div>
                <div>
                    <button type="button" onclick="cargarLegajos()" class="text-sm bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/45 dark:hover:bg-blue-900/45 text-blue-600 dark:text-blue-450 font-bold py-1.5 px-3 rounded-lg border border-blue-100 dark:border-blue-900/50 transition-colors">
                        ↻ Actualizar
                    </button>
                </div>
            </div>

            <div class="mb-4 flex gap-2">
                <button type="button" onclick="exportarBackup()" class="flex-1 text-sm bg-green-100 hover:bg-green-200 dark:bg-green-950/40 dark:hover:bg-green-900/40 text-green-700 dark:text-green-400 font-bold py-2 px-3 rounded text-center transition-colors border border-green-200/30">
                    ⬇️ Exportar Backup
                </button>
                <label class="flex-1 text-sm bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-950/40 dark:hover:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 font-bold py-2 px-3 rounded cursor-pointer text-center transition-colors border border-indigo-200/30">
                    ⬆️ Importar Backup
                    <input type="file" id="inputImportar" accept=".json" class="hidden" onchange="importarBackup(event)">
                </label>
            </div>

            <div id="listaLegajos" class="space-y-4 max-h-[420px] overflow-y-auto pr-2 scrollbar-thin">
                <p class="text-gray-500 dark:text-gray-400 text-sm italic transition-colors">Cargando legajos...</p>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>

</html>
