<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles Legajo - MongoDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        // Aplicar tema guardado inmediatamente
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen p-4 md:p-8 font-sans transition-colors duration-250">

    <!-- NAVBAR -->
    <nav class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md px-6 py-4 mb-8 rounded-2xl max-w-4xl mx-auto flex justify-between items-center transition-colors duration-250">
        <div class="flex items-center gap-3">
            <a href="index.html" class="bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 p-2.5 rounded-xl shadow-sm hover:bg-indigo-200 transition-colors flex items-center justify-center" title="Volver al Dashboard">
                &larr;
            </a>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold text-gray-800 dark:text-gray-100 tracking-tight transition-colors">Detalles del Legajo</h1>
                <p class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wider">SISTEMA MONGODB</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex flex-col text-right">
                <span id="userName" class="text-xs md:text-sm font-bold text-gray-800 dark:text-gray-200 transition-colors">Cargando...</span>
                <span id="userRole" class="text-[9px] self-end px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-indigo-50 text-indigo-600 border border-indigo-100 dark:bg-indigo-950/40 dark:text-indigo-400 dark:border-indigo-900 mt-0.5 transition-colors">...</span>
            </div>
            
            <div class="h-8 w-px bg-gray-200 dark:bg-gray-700"></div>

            <button id="btnTheme" onclick="toggleTheme()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-750 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-2.5 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:shadow-sm active:scale-95 flex items-center justify-center" title="Cambiar Tema">
                <span id="themeIcon">🌙</span>
            </button>
            
            <button onclick="logout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 dark:bg-red-950/20 dark:hover:bg-red-950/40 text-red-600 dark:text-red-400 font-bold text-xs md:text-sm py-2 px-3.5 md:px-4 rounded-xl border border-red-100 dark:border-red-900/50 transition-all hover:shadow-sm active:scale-95" title="Cerrar Sesión">
                <span class="hidden sm:inline">Cerrar</span>
                <span>🚪</span>
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors duration-250">
            <div class="mb-6 border-b dark:border-gray-700 pb-4 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 transition-colors">Ficha de Empleado</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 transition-colors">Visualización y modificación de datos</p>
                </div>
                <!-- Action Buttons Container -->
                <div id="adminActions" class="hidden flex gap-3">
                    <button id="btnModificar" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 dark:bg-indigo-950/50 dark:text-indigo-400 dark:hover:bg-indigo-900/60 font-bold py-2 px-4 rounded-lg shadow-sm transition-all border border-indigo-200 dark:border-indigo-800 text-sm">
                        ✎ Modificar Datos
                    </button>
                    <button id="btnGuardar" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-all text-sm">
                        💾 Guardar Cambios
                    </button>
                </div>
            </div>

            <form id="formDetalles" class="space-y-6">
                <!-- Información Base -->
                <div class="bg-gray-50 dark:bg-gray-750 p-6 rounded-lg border border-gray-200 dark:border-gray-700">
                    <h3 class="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 border-b border-gray-200 dark:border-gray-600 pb-2">Información Principal</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">ID de Legajo</label>
                            <input type="text" id="legajo_id" readonly class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 outline-none transition-colors opacity-80" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">Nombre Completo</label>
                            <input type="text" id="nombre" readonly class="legajo-input w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">Puesto</label>
                            <input type="text" id="puesto" readonly class="legajo-input w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                        </div>
                    </div>
                </div>

                <!-- Información de Contacto -->
                <div class="bg-gray-50 dark:bg-gray-750 p-6 rounded-lg border border-gray-200 dark:border-gray-700">
                    <h3 class="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 border-b border-gray-200 dark:border-gray-600 pb-2">Información de Contacto</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">Email</label>
                            <input type="email" id="email" readonly class="legajo-input w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">Teléfono</label>
                            <input type="text" id="telefono" readonly class="legajo-input w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                        </div>
                    </div>
                </div>

                <!-- Información Adicional -->
                <div class="bg-gray-50 dark:bg-gray-750 p-6 rounded-lg border border-gray-200 dark:border-gray-700">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-200 dark:border-gray-600 pb-2">
                        <h3 class="text-lg font-bold text-gray-700 dark:text-gray-300">Información Adicional (Dinámica)</h3>
                        <button type="button" id="btnAgregarCampo" class="hidden text-xs bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-950/80 dark:hover:bg-indigo-900 text-indigo-700 dark:text-indigo-300 font-bold py-1.5 px-3.5 rounded-lg transition-colors">
                            + Agregar Dato
                        </button>
                    </div>
                    <div id="contenedorCamposDinamicos" class="space-y-3">
                        <p id="msgNoInfo" class="text-sm text-gray-500 dark:text-gray-400 italic">No hay información adicional registrada.</p>
                    </div>
                </div>
            </form>

            <div id="mensaje" class="hidden mt-6 p-3 rounded-lg text-sm text-center font-medium"></div>
        </div>
    </div>

    <script src="js/detalles.js"></script>
</body>

</html>
